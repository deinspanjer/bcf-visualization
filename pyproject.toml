[project]
name = "bcf-visualization"
version = "0.1.0"
description = "Forge Curator and derived-data tooling for the BCF visualization pipeline."
requires-python = ">=3.11,<3.15"

# Core deps for lightweight local work: Forge Curator, schema validation,
# parser/regeneration scripts, and static visualization data generation.
dependencies = [
  "jsonschema>=4.0",
  "textual>=0.79",
  "rich>=13.8",
  "rapidfuzz>=3.9",
  "openpyxl>=3.1",
  "matplotlib>=3.5",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pytest-asyncio", "playwright"]
# Stage 2 agent-curation pipeline only (propose-only MCP server + harness
# transport). Deliberately NOT a core dependency: `scripts/verify.py`, the
# Forge Curator TUI, and the derived-data pipeline must all keep running on
# a base install, so no module reachable from those paths may import `mcp`.
# Pinned below 2.0.0, which is a days-old breaking major (httpx -> httpx2,
# mcp-types split); 1.29 is the mature 1.x head.
curation = ["mcp>=1.29,<2"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: marks tests that exercise heavier model/training paths",
]
