<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mobile UX — Direction studies</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap">
  <style>
    :root {
      color-scheme: dark;
      --void: #03080d;
      --void-deep: #02060a;
      --void-soft: #07121a;
      --ink: #e8fdff;
      --muted: #9ad7df;
      --dim: #5f9ba4;
      --cyan: #5cf4ff;
      --green: #7bffbd;
      --amber: #f5d27b;
      --rose: #ff8aa8;
      --violet: #b49cff;
      --edge: rgba(92, 244, 255, 0.56);
      --edge-soft: rgba(92, 244, 255, 0.22);
      --edge-faint: rgba(92, 244, 255, 0.08);
      --glow: rgba(92, 244, 255, 0.28);
      --panel: rgba(5, 29, 38, 0.5);
      --panel-strong: rgba(5, 29, 38, 0.78);
      --serif: Georgia, "Times New Roman", serif;
      --sans: "Avenir Next", "Segoe UI", system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    html, body {
      margin: 0;
      background: linear-gradient(180deg, #0a1018 0%, #050709 100%);
      color: var(--ink);
      font-family: var(--sans);
      min-height: 100vh;
    }
    /* design canvas root */
    #root { width: 100vw; min-height: 100vh; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="phone-frame.jsx"></script>
  <script type="text/babel" src="sky.jsx"></script>
  <script type="text/babel" src="atoms.jsx"></script>
  <script type="text/babel" src="mockups-portrait.jsx"></script>
  <script type="text/babel" src="mockups-landscape.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
